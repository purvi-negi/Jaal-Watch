<!DOCTYPE html>
<html>
<head>
    <title>Jaal-Watch Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
        }
        
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button.active {
            background-color: #28a745;
        }
        
        #map {
            height: 500px;
            width: 100%;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<h2>Jaal-Watch DWLR Map</h2>

<div class="controls">
    <button id="btnAll" class="active">All Devices</button>
    <button id="btnAlert">Alert Only</button>
    <button id="btnWarning">Warning Only</button>
    <button id="btnNormal">Normal Only</button>
    <button id="btnReset">Reset View</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="map_view.js"></script>

</body>
</html>
